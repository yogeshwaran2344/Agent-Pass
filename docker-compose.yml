version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpass_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpass -d agentpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentpass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentpass-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentpass}:${POSTGRES_PASSWORD:-agentpass_secret}@postgres:5432/${POSTGRES_DB:-agentpass}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-agentpass_production_secret_key_change_me_in_prod_1234567890}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-mock_client_id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-mock_client_secret}
      PAYPAL_API_BASE: https://api-m.sandbox.paypal.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentpass-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
