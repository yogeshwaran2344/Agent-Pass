# ==============================================================================
# AGENTPASS — Render Deployment Blueprint (Infrastructure-as-Code)
# ==============================================================================
# Render Hackathon Deployment Blueprint:
# Automatically provisions PostgreSQL 16, FastAPI Backend, and React Vite Frontend.

databases:
  - name: agentpass-postgres
    databaseName: agentpass
    user: agentpass
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Production Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: agentpass-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: agentpass-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: agentpass-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agentpass-backend
          property: host
