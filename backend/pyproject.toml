[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "B008",  # Allow FastAPI Depends() in endpoint definitions
    "E501",  # Line length handled by formatter
    "UP017", # Allow datetime.timezone.utc
    "E712",  # Allow SQLAlchemy Column == True/False expressions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
